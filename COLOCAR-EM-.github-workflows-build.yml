name: Gerar instalador MSI

on:
  push:
    tags: ["v*"]          # ao criar uma tag (ex.: v1.0.0) publica o MSI na página de Releases
  pull_request:
  workflow_dispatch:      # também dá para rodar manualmente

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ajustar a versão pela tag (v1.2.0 vira 1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "A tag precisa ser no formato v1.2.3 (veio: $v)" }
          (Get-Content adge_nf/__init__.py) -replace 'VERSAO = ".*"', "VERSAO = `"$v`"" | Set-Content adge_nf/__init__.py -Encoding utf8
          Select-String -Path adge_nf/__init__.py -Pattern 'VERSAO'

      - name: Instalar dependências
        run: pip install -r requirements-build.txt

      - name: Testes do núcleo
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Teste da interface (abre a janela de verdade)
        run: python tests/smoke_gui.py

      - name: Teste do Cofre do Windows (chave das senhas)
        continue-on-error: true
        run: python -c "from adge_nf.store import Armazenamento; import tempfile; a=Armazenamento(tempfile.mkdtemp()); t=a.cifrar('teste'); assert a.decifrar(t)=='teste'; print('Cofre do Windows OK')"

      - name: Gerar o MSI
        run: python setup.py bdist_msi

      - name: Conferir o MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI não foi gerado" }
          "{0} ({1:N1} MB)" -f $msi.Name, ($msi.Length / 1MB)

      - name: Gerar o código de verificação (SHA-256)
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          $h = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($msi.Name)" | Out-File -Encoding ascii "$($msi.FullName).sha256"
          Get-Content "$($msi.FullName).sha256"

      - name: Testar instalação silenciosa e abrir o programa
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec saiu com $($p.ExitCode)" }
          $exe = Get-ChildItem "C:\Program Files*\Adge Group" -Recurse -Filter AdgeNFDownloader.exe | Select-Object -First 1
          if (-not $exe) { throw "Executável instalado não encontrado" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw "O programa fechou sozinho (código $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          "Programa instalado abriu e ficou rodando."

      - uses: actions/upload-artifact@v4
        with:
          name: Adge-NF-Downloader-MSI
          path: |
            dist/*.msi
            dist/*.msi.sha256

      - name: Texto da Release (relatório da versão em docs/atualizacoes)
        id: nota
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $arq = "docs/atualizacoes/${{ github.ref_name }}.md"
          if (Test-Path $arq) {
            "arquivo=$arq" >> $env:GITHUB_OUTPUT
            "gerar=false" >> $env:GITHUB_OUTPUT
            "Usando o relatório $arq como texto da Release."
          } else {
            "arquivo=" >> $env:GITHUB_OUTPUT
            "gerar=true" >> $env:GITHUB_OUTPUT
            "Sem relatório em $arq: usando as notas automáticas do GitHub."
          }

      - name: Publicar na Release (quando for uma tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.msi.sha256
          body_path: ${{ steps.nota.outputs.arquivo }}
          generate_release_notes: ${{ steps.nota.outputs.gerar == 'true' }}
